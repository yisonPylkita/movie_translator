[package]
name = "mt-fetch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mt-core = { path = "../mt-core" }
mt-subtitles = { path = "../mt-subtitles" }
mt-discovery = { path = "../mt-discovery" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { version = "2" }
reqwest = { version = "0.13", features = ["blocking", "cookies", "rustls", "json"], default-features = false }
scraper = "0.27"
quick-xml = { version = "0.40" }
md-5 = "0.11"
zip = "2"
regex = "1"
tracing = "0.1"
urlencoding = "2"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"

[dependencies.ndarray]
version = "0.17"
