[project]
name = "movie-translator"
version = "1.0.0"
description = "ML backend (translation, OCR, inpainting, filename parsing) for the movie-translator Rust CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.15"
authors = [{ name = "Movie Translator Team" }]
keywords = ["subtitles", "translation", "video", "mkv", "mp4", "ai", "polish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pysubs2~=1.8",
    "transformers>=5.0.0rc3",
    "torch~=2.7",
    "sentencepiece~=0.2",
    "protobuf>=3.20",
    "rich~=14.0",
    "static-ffmpeg~=2.7",
    "fonttools>=4.61.0",
    "pyobjc-framework-Vision>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "numpy>=1.26",
    "Pillow>=10.0",
    "simple-lama-inpainting>=0.1.0",
    "opencv-python-headless>=4.8",
    "guessit>=3.8",
    "aniparse>=2.0",
    "defusedxml>=0.7",
    "yt-dlp>=2026.3.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["movie_translator"]

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=9.0", "pytest-xdist>=3.5", "pytest-asyncio>=0.24", "ty"]
# `uv sync --group benchmarks` to install scoring deps used by
# benchmarks/onepiece/strategies.py. Kept out of runtime + dev groups so
# the production install stays lean.
benchmarks = ["sacrebleu~=2.6"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["movie_translator"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["movie_translator"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-n auto"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring FFmpeg",
]

[tool.ty.src]
exclude = ["vendor/**"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
possibly-missing-import = "ignore"

# Quartz/Vision are macOS-only (pyobjc); unresolved on Linux, ignore comments unused on Linux
[[tool.ty.overrides]]
include = ["movie_translator/ocr/vision_ocr.py", "movie_translator/ocr/pgs_extractor.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"
unused-ignore-comment = "ignore"
