name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Python is needed at test time: a handful of Rust integration tests spawn
      # the ml/ CLI scripts (filename parsing via guessit/aniparse, and the
      # ml/*.py --self-test contract round-trips). Heavy ML deps (torch) are only
      # used by #[ignore]'d tests, which do not run in CI.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install Python ML-backend deps
        run: uv sync --group dev
        env:
          UV_EXTRA_INDEX_URL: ${{ runner.os == 'Linux' && 'https://download.pytorch.org/whl/cpu' || '' }}

      - name: Rustfmt (check)
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Ruff (ml/ scripts)
        run: uv run ruff check ml/
