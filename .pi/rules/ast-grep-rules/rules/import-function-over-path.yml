id: import-function-over-path
language: Rust
severity: info
message: "Use `use $CRATE::$FUNC;` instead of calling `$CRATE::$FUNC(...)` inline"
note: |
  Functions and macros used repeatedly in a file should be imported at the top
  and called with their short name.

  Before:
    tracing::info!("hello");
    serde_json::from_str(json)?;

  After:
    use tracing::info;
    use serde_json::from_str;

    info!("hello");
    from_str(json)?;
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: scoped_identifier
        pattern: $CRATE::$FUNC
