id: no-inline-type-annotation
language: Rust
severity: info
message: "Unnecessary type annotation `$TYPE` — the RHS already produces `$TYPE`. Remove the `:$TYPE` annotation."
note: |
  Rust infers types from the right-hand side when the constructor is unambiguous.
  Write `let x = Vec::new()` instead of `let x: Vec<_> = Vec::new()`.

  Exception: `collect()` calls and `serde_json::from_str()` where inference
  genuinely needs the type hint. Use `collect::<Vec<_>>()` turbofish instead.
rule:
  all:
    - kind: let_declaration
    - has:
        field: type
    - has:
        field: value
        has:
          kind: call_expression
          has:
            field: function
            kind: scoped_identifier
            # Match `$TYPE::method()` where $TYPE is the same as the annotation
            # e.g. `let x: Vec<i32> = Vec::new()` or `let x: Vec<_> = Vec::with_capacity(10)`
    - not:
        any:
          # Exclude `collect()` calls — turbofish is the right fix there
          - pattern: ".collect($$$)"
          - pattern: ".collect::<$TYPE>($$$)"
          # Exclude serde deserialization — type needed for inference
          - pattern: "serde_json::from_str($$$)"
          - pattern: "serde_json::from_slice($$$)"
          - pattern: "serde_json::from_reader($$$)"
          - pattern: "serde_json::from_value($$$)"
